name: Production browser E2E (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/production-e2e.py
      - .github/workflows/production-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser test of live production (no writes)
        env:
          TLNM_PRODUCTION_URL: https://trustedlocksmithnearme.com
        run: python scripts/production-e2e.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-e2e-evidence
          path: artifacts/production-e2e
          if-no-files-found: ignore
