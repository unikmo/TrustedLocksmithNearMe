name: Production browser E2E (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/production-e2e.py
      - .github/workflows/production-e2e.yml
  push:
    branches: [main]
    paths:
      - next.config.ts
      - scripts/production-e2e.py
      - .github/workflows/production-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Wait for pricing route on updated production deployment
        if: github.event_name == 'push'
        run: |
          for i in {1..15}; do
            if curl -fsSL --max-time 15 https://trustedlocksmithnearme.com/pricing | grep -q 'An extra cushion'; then
              echo 'Updated pricing live'; exit 0
            fi
            sleep 15
          done
          echo 'Production did not expose new pricing within verification window' >&2
          exit 1
      - name: Browser test of live production (no writes)
        env:
          TLNM_PRODUCTION_URL: https://trustedlocksmithnearme.com
        run: python scripts/production-e2e.py
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-e2e-evidence
          path: artifacts/production-e2e
          if-no-files-found: ignore
